server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker and manifest must never be cached so updates reach users
    location ~* (sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Hashed assets can be cached aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else falls back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
